<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мафия - Настольная Игра</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #0d0d0d;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 1100px;
            background: #141414;
            border: 2px solid #bc1b1b;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(188, 27, 27, 0.25);
        }

        .screen.active {
            display: block;
        }

        h1, h2 {
            text-align: center;
            color: #bc1b1b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        button {
            background: #bc1b1b;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            background: #ff2e2e;
            box-shadow: 0 0 15px rgba(255, 46, 46, 0.6);
        }

        select, input[type="text"] {
            background: #1f1f1f;
            color: white;
            border: 1px solid #bc1b1b;
            padding: 12px;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
            margin-bottom: 15px;
        }.players-list {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 35px;
        }

        .player-card {
            background: #1a1a1a;
            width: 18.5%;
            padding: 20px 10px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(188, 27, 27, 0.3);
            position: relative;
            transition: 0.3s ease-in-out;
        }

        .player-card.active-target {
            border-color: #ffcc00;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
        }

        .player-card.dead {
            opacity: 0.25;
            background: #080808;
            border-color: #333;
        }

        .avatar-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #1f1f1f;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #bc1b1b;
            box-shadow: 0 0 10px rgba(188, 27, 27, 0.4);
            overflow: hidden;
        }

        .avatar-circle svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .player-role {
            font-size: 13px;
            color: #ffcc00;
            margin-top: 8px;
            font-weight: bold;
        }

        .vote-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ffcc00;
            color: black;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
            display: none;
            box-shadow: 0 0 8px rgba(255, 204, 0, 0.6);
        }

        .menu-layout, .editor-layout {
            display: flex;
            justify-content: space-between;
            gap: 30px;
        }

        .profile-preview, .editor-preview {
            text-align: center;
            width: 40%;
            background: #141414;
            padding: 25px;
            border-radius: 10px;
            border: 1px dashed #bc1b1b;
        }

        .menu-buttons, .editor-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 55%;
        }

        .option-group {
            margin-bottom: 15px;
            background: #1a1a1a;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #bc1b1b;
        }

        .option-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ccc;
        }

        .radio-set {
            display: flex;
            gap: 10px;
        }

        .radio-set label {
            background: #242424;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            width: 50%;
            text-align: center;
            border: 1px solid #333;
        }

        .radio-set input {
            display: none;
        }

        .radio-set input:checked + label {
            background: #bc1b1b;
            color: white;
            border-color: #ff2e2e;
        }

        .game-status {
            background: #1a1a1a;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 18px;
            border-left: 5px solid #bc1b1b;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;z-index: 100;
        }

        .modal-content {
            background: #141414;
            border: 2px solid #bc1b1b;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 30px rgba(188, 27, 27, 0.5);
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }
    </style>
</head><body>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="screen-menu" class="screen active">
        <h1>Мафия</h1>
        <div class="menu-layout">
            <div class="profile-preview">
                <div id="menu-avatar" class="avatar-circle"></div>
                <h3 id="menu-nickname">Фамилия / Ник</h3>
            </div>
            <div class="menu-buttons">
                <button onclick="goToScreen('screen-modes')">Играть</button>
                <button onclick="goToScreen('screen-editor')">Изменить персонажа</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: РЕДАКТОР ПЕРСОНАЖА -->
    <div id="screen-editor" class="screen">
        <h2>Редактор персонажа</h2>
        <div class="editor-layout">
            <div class="editor-preview">
                <div id="editor-avatar-view" class="avatar-circle"></div>
                <p style="color:#aaa; margin-top:10px;">Реалистичный векторный портрет</p>
            </div>
            <div class="editor-options">
                <label>Напишите никнейм или фамилию:</label>
                <input type="text" id="input-nickname" placeholder="Например: Дон Сальери" value="Игрок" oninput="previewCharacter()">

                <div class="option-group">
                    <label>Пол:</label>
                    <div class="radio-set">
                        <input type="radio" id="gender-m" name="gender" value="М" checked onchange="previewCharacter()">
                        <label for="gender-m">М</label>
                        <input type="radio" id="gender-f" name="gender" value="Ж" onchange="previewCharacter()">
                        <label for="gender-f">Ж</label>
                    </div>
                </div>

                <div class="option-group">
                    <label>Борода и усы:</label>
                    <div class="radio-set">
                        <input type="radio" id="beard-yes" name="beard" value="есть" checked onchange="previewCharacter()">
                        <label for="beard-yes">Есть</label>
                        <input type="radio" id="beard-no" name="beard" value="нет" onchange="previewCharacter()">
                        <label for="beard-no">Нет</label>
                    </div>
                    <select id="select-beard-style" style="margin-top:10px;" onchange="previewCharacter()">
                        <option value="beard1">Легкая бородка и усы</option>
                        <option value="beard2">Тонкие мафиози-усы</option>
                        <option value="beard3">Суровая щетина</option>
                    </select>
                </div>

                <div class="option-group">
                    <label>Причёска:</label>
                    <select id="select-hair" onchange="previewCharacter()">
                        <option value="hair1">Стильный зализ назад (Как на фото)</option>
                        <option value="hair2">Классическая короткая</option>
                        <option value="hair3">Пробор в сторону</option>
                        <option value="hair4">Объемная стрижка</option>
                        <option value="hair5">Лысый Брутал</option>
                    </select>
                </div>

                <div class="option-group">
                    <label>Одежда:</label>
                    <select id="select-clothes" onchange="previewCharacter()">
                        <option value="suit1">Строгий черный костюм</option>
                        <option value="suit2">Темно-серый пиджак</option>
                        <option value="suit3">Бордовый смокинг</option>
                    </select>
                </div>

                <button onclick="saveCharacter()" style="width:100%;">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: ВЫБОР РЕЖИМА -->
    <div id="screen-modes" class="screen">
        <h2>Выберите режим игры</h2>
        <div class="mode-buttons"><button class="btn-disabled" disabled>Онлайн с игроками (Недоступно)</button>
            <button onclick="startOfflineGame()">Офлайн с ботами</button>
            <button onclick="goToScreen('screen-menu')" class="btn-back" style="background:#444;">Назад</button>
        </div>
    </div>

    <!-- ЭКРАН 4: ИГРОВОЙ СТОЛ -->
    <div id="screen-game" class="screen">
        <h2>Игровой стол (Офлайн)</h2>
        <div id="game-info" class="game-status">Нажмите кнопку «Распределить роли», чтобы начать партию.</div>
        
        <div class="players-list" id="players-container">
            <!-- JavaScript генерирует карточки сюда -->
        </div>

        <div class="game-controls">
            <button id="btn-action" onclick="gameActionButton()">Распределить роли</button>
            <button id="btn-next-phase" style="display:none; background:#444;" onclick="nextPhase()">Пропустить ход/фазу</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div id="game-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Вы выбыли!</h2>
            <p id="modal-text">Вас убрали из игры.</p>
            <div class="modal-buttons">
                <button onclick="closeModalAndGoMenu()">В главное меню</button>
                <button onclick="continueAsSpectator()" id="btn-spectate">Смотреть остаток</button>
            </div>
        </div>
    </div><script>
        let playerConfig = JSON.parse(localStorage.getItem('mafia_player')) || {
            nickname: "Дон Карлеоне",
            gender: "М",
            hair: "hair1",
            beard: "beard1",
            hasBeard: "есть",
            clothes: "suit1"
        };

        let players = [];
        let playerRole = "";
        let currentPhase = "setup";
        let selectedTarget = null;
        let isDead = false;
        let votes = {};

        const botNames = ["Луиджи", "Бруно", "Сальери", "Тони", "Вито", "Сэм", "Поли", "Фрэнк"];
        const rolesPool = ["Мафия", "Шериф", "Доктор", "Мирный житель", "Мирный житель"];

        // Генерация высокодетализированного мужского лица (стиль реалистичного векторного арта)
        function generateFaceSVG(hair, beardStyle, hasBeard, clothes, isBot = false, botSeed = 1) {
            let skin = "#f3ccb6"; 
            let shadowSkin = "#dfa687"; 
            let hairColor = isBot ? (botSeed % 2 === 0 ? "#3b2314" : "#1a1a1a") : "#151515";
            let suitColor = clothes === "suit1" ? "#1a1a1a" : (clothes === "suit2" ? "#3a3a3a" : "#5b1111");
            
            if (isBot) {
                hair = ["hair1", "hair2", "hair3", "hair5"][botSeed % 4];
                hasBeard = botSeed % 2 === 0 ? "есть" : "нет";
                beardStyle = ["beard1", "beard2", "beard3"][botSeed % 3];
                suitColor = ["#1e1e1e", "#2c3e50", "#4a1212"][botSeed % 3];
            }

            // Анатомия лица (Форма головы со скулами, уши, тени)
            let baseHead = `
                <path d="M25 45 Q22 55 25 62 Q28 78 50 84 Q72 78 75 62 Q78 55 75 45 Q75 30 50 28 Q25 30 25 45 Z" fill="${skin}"/>
                <path d="M50 28 Q75 30 75 45 Q75 55 72 65 Q65 78 50 84 Z" fill="${shadowSkin}" opacity="0.25"/> <!-- Светотень -->
                <circle cx="21" cy="54" r="6" fill="${skin}"/><circle cx="79" cy="54" r="6" fill="${skin}"/>
            `;

            // Реалистичные полуприкрытые глаза мафиози
            let eyes = `
                <path d="M32 48 Q40 43 47 48 Q40 51 32 48 Z" fill="#fff" stroke="#442211" stroke-width="0.5"/>
                <circle cx="39.5" cy="47.5" r="3" fill="#2c3e50"/><circle cx="39.5" cy="47.5" r="1.2" fill="#000"/>
                <path d="M53 48 Q60 43 68 48 Q60 51 53 48 Z" fill="#fff" stroke="#442211" stroke-width="0.5"/>
                <circle cx="60.5" cy="47.5" r="3" fill="#2c3e50"/><circle cx="60.5" cy="47.5" r="1.2" fill="#000"/>
                <path d="M30 46 Q40 41 48 45" stroke="#111" stroke-width="1.5" fill="none"/> <!-- Веки -->
                <path d="M52 46 Q60 41 70 45" stroke="#111" stroke-width="1.5" fill="none"/>
            `;

            let eyebrows = `
                <path d="M28 41 Q38 36 46 41" stroke="${hairColor}" stroke-width="3" stroke-linecap="round" fill="none"/>
                <path d="M72 41 Q62 36 54 41" stroke="${hairColor}" stroke-width="3" stroke-linecap="round" fill="none"/>
            `;

            let nose = `
                <path d="M47 43 L45 58 Q50 62 55 58 L53 43 Z" fill="${shadowSkin}" opacity="0.4"/>
                <path d="M47 58 Q50 61 53 58" stroke="#b88365" stroke-width="1.5" fill="none"/>
            `;

            let mouth = '<path d="M38 68 Q50 71 62 68" stroke="#9e564d" stroke-width="2" fill="none"/><path d="M43 68 L57 68" stroke="#4a1515" stroke-width="1" fill="none"/>';

            // Прически (Стильный зализ с объемом и текстурой, проборы)
            let hairSVG = '';
            if (hair === "hair1") hairSVG = `<path d="M23 42 Q50 8 77 42 C72 20 28 20 23 42 Z" fill="${hairColor}"/><path d="M30 26 Q50 16 65 24" stroke="#444" stroke-width="1" fill="none"/>`; 
            if (hair === "hair2") hairSVG = `<path d="M24 42 Q50 20 76 42 C74 28 26 28 24 42 Z" fill="${hairColor}"/>`; 
            if (hair === "hair3") hairSVG = `<path d="M23 42 Q35 15 52 24 Q75 18 77 42 C70 24 45 28 23 42 Z" fill="${hairColor}"/>`;if (hair === "hair4") hairSVG = `<path d="M22 44 Q50 12 78 44 L81 58 L74 54 Q50 30 26 54 L19 58 Z" fill="${hairColor}"/>`;
            if (hair === "hair5") hairSVG = `<path d="M25 35 Q50 25 75 35" stroke="${shadowSkin}" stroke-width="2" fill="none"/>`; // Лысый (тени)

            // Бороды и усы
            let beardSVG = '';
            if (hasBeard === "есть") {
                if (beardStyle === "beard1") beardSVG = `<path d="M25 58 Q50 94 75 58 Q77 75 66 86 Q50 99 34 86 Q23 75 25 58" fill="${hairColor}" opacity="0.95"/>`;
                if (beardStyle === "beard2") beardSVG = `<path d="M36 62 Q50 56 64 62 Q50 67 36 62" fill="${hairColor}"/>`; 
                if (beardStyle === "beard3") beardSVG = `<path d="M25 58 Q50 91 75 58" stroke="#555" stroke-width="4.5" stroke-dasharray="1,2" fill="none"/>`;
            }

            // Костюм, белоснежная рубашка и строгий галстук
            let suitSVG = `
                <path d="M10 88 L90 88 L105 125 L115 150 L-15 150 L-5 125 Z" fill="${suitColor}"/>
                <path d="M34 88 L50 122 L66 88 Z" fill="#ffffff"/> <!-- Рубашка -->
                <path d="M34 88 L46 102 L50 88 Z" fill="#ddd"/><path d="M66 88 L54 102 L50 88 Z" fill="#ddd"/> <!-- Воротник -->
                <path d="M45 100 L55 100 L52 135 L48 135 Z" fill="#111"/> <!-- Галстук -->
            `;

            return `
                <svg viewBox="0 0 100 100" xmlns="http://w3.org">
                    <circle cx="50" cy="50" r="49" fill="#181818" stroke="#333" stroke-width="1"/>
                    ${baseHead}
                    ${eyebrows}
                    ${eyes}
                    ${nose}
                    ${mouth}
                    ${beardSVG}
                    ${hairSVG}
                    ${suitSVG}
                </svg>
            `;
        }

        function previewCharacter() {
            let h = document.getElementById('select-hair').value;
            let bStyle = document.getElementById('select-beard-style').value;
            let hBeard = document.querySelector('input[name="beard"]:checked').value;
            let cl = document.getElementById('select-clothes').value;

            document.getElementById('editor-avatar-view').innerHTML = generateFaceSVG(h, bStyle, hBeard, cl, false);
        }

        function saveCharacter() {
            playerConfig.nickname = document.getElementById('input-nickname').value || "Игрок";
            playerConfig.gender = document.querySelector('input[name="gender"]:checked').value;
            playerConfig.hair = document.getElementById('select-hair').value;
            playerConfig.beard = document.getElementById('select-beard-style').value;
            playerConfig.hasBeard = document.querySelector('input[name="beard"]:checked').value;
            playerConfig.clothes = document.getElementById('select-clothes').value;

            localStorage.setItem('mafia_player', JSON.stringify(playerConfig));
            applySavedCharacter();
            goToScreen('screen-menu');
        }

        function applySavedCharacter() {
            document.getElementById('menu-nickname').innerText = playerConfig.nickname;
            document.getElementById('menu-avatar').innerHTML = generateFaceSVG(playerConfig.hair, playerConfig.beard, playerConfig.hasBeard, playerConfig.clothes, false);
            
            document.getElementById('input-nickname').value = playerConfig.nickname;
            document.getElementById('select-hair').value = playerConfig.hair;
            document.getElementById('select-beard-style').value = playerConfig.beard;
            document.getElementById('select-clothes').value = playerConfig.clothes;
            if(playerConfig.gender === "Ж") document.getElementById('gender-f').checked = true;
            if(playerConfig.hasBeard === "нет") document.getElementById('beard-no').checked = true;
            previewCharacter();
        }

        window.onload = function() {
            applySavedCharacter();
        };function startOfflineGame() {
            goToScreen('screen-game');
            resetGame();
        }function resetGame() {
            currentPhase = "setup";
            isDead = false;
            selectedTarget = null;
            document.getElementById('game-info').innerText = "Нажмите кнопку «Распределить роли», чтобы начать партию.";
            document.getElementById('btn-action').innerText = "Распределить роли";
            document.getElementById('btn-action').style.display = "inline-block";
            document.getElementById('btn-next-phase').style.display = "none";

            // Сборка 5 участников с реалистичными лицами
            players = [
                { id: 0, name: playerConfig.nickname, role: "", isBot: false, isAlive: true },
                { id: 1, name: "Луиджи", role: "", isBot: true, isAlive: true, seed: 14 },
                { id: 2, name: "Бруно", role: "", isBot: true, isAlive: true, seed: 27 },
                { id: 3, name: "Тони", role: "", isBot: true, isAlive: true, seed: 39 },
                { id: 4, name: "Вито", role: "", isBot: true, isAlive: true, seed: 52 }
            ];
            renderPlayers();
        }

        function renderPlayers() {
            const container = document.getElementById('players-container');
            if (!container) return;
            container.innerHTML = "";

            players.forEach((p) => {
                let card = document.createElement('div');
                card.className = `player-card ${p.isAlive ? '' : 'dead'}`;
                card.id = `player-${p.id}`;
                
                let roleText = "Роль: ?";
                if (!p.isBot && p.role) roleText = `Роль: ${p.role}`;
                if (currentPhase === "game_over" || (!p.isAlive && p.isBot)) roleText = `Роль: ${p.role}`;

                let avatarSVG = p.isBot ? generateFaceSVG("", "", "", "", true, p.seed) : generateFaceSVG(playerConfig.hair, playerConfig.beard, playerConfig.hasBeard, playerConfig.clothes, false);

                card.innerHTML = `
                    <div class="vote-badge" id="badge-${p.id}">0</div>
                    <div class="avatar-circle">${avatarSVG}</div>
                    <div style="font-weight:bold; font-size:14px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">${p.name} ${p.id === 0 ? '(Вы)' : ''}</div>
                    <div class="player-role">${roleText}</div>
                `;

                if (p.isAlive && currentPhase === "day_vote" && p.id !== 0) {
                    card.classList.add('active-target');
                    card.onclick = () => selectVoteTarget(p.id);
                } else if (p.isAlive && currentPhase === "night_mafia" && playerRole === "Мафия" && p.id !== 0) {
                    card.classList.add('active-target');
                    card.onclick = () => selectMafiaTarget(p.id);
                }

                container.appendChild(card);
            });
        }

        function gameActionButton() {
            if (currentPhase === "setup") {
                shuffleRoles();
            } else if (currentPhase === "game_over") {
                resetGame(); 
            }
        }

        function shuffleRoles() {
            let pool = [...rolesPool];
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            
            players.forEach((p, i) => { p.role = pool[i]; });
            playerRole = players[0].role; // Исправлено: строго привязываемся к объекту игрока

            document.getElementById('btn-action').style.display = "none";
            document.getElementById('btn-next-phase').style.display = "inline-block";
            
            startNight();
        }

        function startNight() {
            currentPhase = "night_sleep";
            document.getElementById('game-info').innerText = "Город засыпает... Нажмите кнопку пропуска фазы, чтобы проснулась Мафия.";
            renderPlayers();
        }function nextPhase() {
            if (currentPhase === "night_sleep") {
                currentPhase = "night_mafia";
                if (playerRole === "Мафия" && players[0].isAlive) {
                    document.getElementById('game-info').innerText = "Проснулась Мафия! Выберите цель среди ботов.";
                    renderPlayers();
                } else {
                    document.getElementById('game-info').innerText = "Мафия делает свой выбор... (Бот думает)";
                    setTimeout(() => { nextPhase(); }, 1200);
                    return;
                }
            } 
            else if (currentPhase === "night_mafia") {
                currentPhase = "night_sheriff";
                if (playerRole === "Шериф" && players[0].isAlive) {
                    document.getElementById('game-info').innerText = "Проснулся Шериф! Выберите игрока для проверки.";
                    enableSheriffAction();
                } else {
                    document.getElementById('game-info').innerText = "Шериф ищет преступников... (Бот думает)";
                    setTimeout(() => { nextPhase(); }, 1200);
                    return;
                }
            } 
            else if (currentPhase === "night_sheriff") {
                currentPhase = "night_doctor";
                if (playerRole === "Доктор" && players[0].isAlive) {
                    document.getElementById('game-info').innerText = "Проснулся Доктор! Выберите, кого спасти.";
                    enableDoctorAction();
                } else {
                    document.getElementById('game-info').innerText = "Доктор спасает жизни... (Бот думает)";
                    setTimeout(() => { nextPhase(); }, 1200);
                    return;
                }
            } 
            else if (currentPhase === "night_doctor") {
                processNightResults();
            } 
            else if (currentPhase === "day_chat") {
                currentPhase = "day_vote";
                document.getElementById('game-info').innerText = "Время голосования! Кликните по подозреваемому боту.";
                resetVotes();
            }
        }

        function selectMafiaTarget(id) {
            selectedTarget = id;
            document.getElementById('game-info').innerText = `Вы выбрали убрать игрока ${players[id].name}. Нажмите кнопку пропуска хода.`;
        }

        function enableSheriffAction() {
            players.forEach(p => {
                if (p.isAlive && p.id !== 0) {
                    let card = document.getElementById(`player-${p.id}`);
                    if (card) {
                        card.classList.add('active-target');
                        card.onclick = () => {
                            alert(`Проверка Шерифа: Игрок ${p.name} — ${p.role === 'Мафия' ? 'Мафия 🥷' : 'Мирный гражданин 🤵'}`);
                            nextPhase();
                        };
                    }
                }
            });
        }

        function enableDoctorAction() {
            players.forEach(p => {
                if (p.isAlive) {
                    let card = document.getElementById(`player-${p.id}`);
                    if (card) {
                        card.classList.add('active-target');
                        card.onclick = () => {
                            selectedTarget = p.id;
                            alert(`Вы вылечили: ${p.name}`);
                            nextPhase();
                        };
                    }
                }
            });
        }function processNightResults() {
            let victimId = null; 
            
            if (playerRole === "Мафия" && players[0].isAlive) {
                victimId = selectedTarget;
            } else {
                let mafiaBot = players.find(p => p.role === "Мафия" && p.isAlive);
                if (mafiaBot) {
                    let aliveTargets = players.filter(p => p.isAlive && p.role !== "Мафия");
                    if (aliveTargets.length > 0) victimId = aliveTargets[Math.floor(Math.random() * aliveTargets.length)].id;
                }
            }

            let healedId = null;
            if (playerRole === "Доктор" && players[0].isAlive) {
                healedId = selectedTarget;
            } else {
                let doctorBot = players.find(p => p.role === "Доктор" && p.isAlive);
                if (doctorBot) {
                    let alive = players.filter(p => p.isAlive);
                    healedId = alive[Math.floor(Math.random() * alive.length)].id;
                }
            }

            let message = "Наступило утро! ";
            if (victimId !== null && victimId !== healedId) {
                players[victimId].isAlive = false;
                message += `Этой ночью был убит: ${players[victimId].name}.`;
                if (victimId === 0) isDead = true;
            } else if (victimId !== null && victimId === healedId) {
                message += `Было покушение на ${players[victimId].name}, но Доктор вовремя спас его!`;
            } else {
                message += "Ночь прошла без происшествий.";
            }

            selectedTarget = null;
            currentPhase = "day_chat";
            document.getElementById('game-info').innerText = message + " Нажмите кнопку пропуска фазы, чтобы перейти к голосованию.";
            renderPlayers();

            if (isDead) showDeathModal();
            checkWinConditions();
        }

        function resetVotes() {
            votes = {};
            players.forEach(p => { if (p.isAlive) votes[p.id] = 0; });
            renderPlayers();
        }

        function selectVoteTarget(botId) {
            resetVotes();
            votes[botId] = 1;
            
            players.forEach(p => {
                if (p.isBot && p.isAlive) {
                    let alivePlayers = players.filter(pl => pl.isAlive && pl.id !== p.id);
                    let randomTarget = alivePlayers[Math.floor(Math.random() * alivePlayers.length)].id;
                    votes[randomTarget] = (votes[randomTarget] || 0) + 1;
                }
            });

            for (let id in votes) {
                let badge = document.getElementById(`badge-${id}`);
                if (badge && votes[id] > 0) {
                    badge.innerText = `${votes[id]}/5`;
                    badge.style.display = "flex";
                }
            }

            let maxVotes = -1;
            let expelledId = null;
            for (let id in votes) {
                if (votes[id] > maxVotes) {
                    maxVotes = votes[id];
                    expelledId = parseInt(id);
                }
            }

            setTimeout(() => {
                players[expelledId].isAlive = false;
                alert(`По итогам голосования посажен в тюрьму: ${players[expelledId].name}`);
                if (expelledId === 0) {
                    isDead = true;
                    showDeathModal();
                }
                if (!checkWinConditions()) startNight();
            }, 1200);
        }

        function checkWinConditions() {
            let mafiaAlive = players.some(p => p.role === "Мафия" && p.isAlive);
            let citizensAlive = players.filter(p => p.role !== "Мафия" && p.isAlive).length;

            if (!mafiaAlive) {
                endGame("Мирные жители победили! Мафия устранена.");
                return true;
            } else if (citizensAlive <= 1) {
                endGame("Мафия победила! Город захвачен преступниками.");return true;
            }
            return false;
        }

        function endGame(text) {
            currentPhase = "game_over";
            document.getElementById('game-info').innerText = "ИГРА ОКОНЧЕНА. " + text;
            document.getElementById('btn-action').innerText = "Новая игра";
            document.getElementById('btn-action').style.display = "inline-block";
            document.getElementById('btn-next-phase').style.display = "none";
            renderPlayers();
        }

        function showDeathModal() {
            document.getElementById('game-modal').style.display = "flex";
        }

        function closeModalAndGoMenu() {
            document.getElementById('game-modal').style.display = "none";
            goToScreen('screen-menu');
        }

        function continueAsSpectator() {
            document.getElementById('game-modal').style.display = "none";
            document.getElementById('game-info').innerText = "Вы погибли, но продолжаете наблюдать за игрой ботов как призрак.";
            renderPlayers();
        }
    </script>
</body>
</html>
